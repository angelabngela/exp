<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0c3483 0%, #a2b6df 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 25px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #0c3483, #1e5799);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header .icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .progress-container {
            background: #e0e5ec;
            height: 8px;
            position: relative;
        }

        .progress-bar {
            background: linear-gradient(90deg, #00b894, #00cec9);
            height: 100%;
            transition: width 0.5s ease;
            border-radius: 0 4px 4px 0;
        }

        .progress-text {
            text-align: center;
            padding: 10px;
            color: #666;
            font-size: 14px;
            font-weight: 600;
        }

        .content {
            padding: 30px;
            min-height: 400px;
        }

        .question-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            border-left: 5px solid #0c3483;
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .question-number {
            color: #0c3483;
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 22px;
            color: #2d3436;
            margin-bottom: 15px;
            line-height: 1.4;
            font-weight: 500;
        }

        .question-context {
            font-size: 14px;
            color: #636e72;
            margin-bottom: 25px;
            padding: 12px 15px;
            background: #dfe6e9;
            border-radius: 8px;
            line-height: 1.5;
        }

        .options {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 18px 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            line-height: 1.3;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn:hover {
            transform: translateY(-3px);
        }

        /* Two-option styles */
        .btn-option1 {
            background: linear-gradient(135deg, #FE6100, #FFB000);
            color: white;
            box-shadow: 0 5px 15px rgba(255, 192, 0, 0.3);
        }

        .btn-option1:hover {
            box-shadow: 0 10px 25px rgba(255, 192, 0, 0.4);
        }

        .btn-option2 {
            background: linear-gradient(135deg, #DC267F, #d63031);
            color: white;
            box-shadow: 0 5px 15px rgba(254, 48, 49, 0.3);
        }

        .btn-option2:hover {
            box-shadow: 0 10px 25px rgba(254, 48, 49, 0.4);
        }

        /* Three-option additional button */
        .btn-option3 {
            background: linear-gradient(135deg, #785EF0, #a855f7);
            color: white;
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.3);
        }

        .btn-option3:hover {
            box-shadow: 0 10px 25px rgba(108, 92, 231, 0.4);
        }

        /* Two-option specific spacing */
        .options.two-options .btn {
            flex: 1;
            padding: 18px 30px;
            font-size: 18px;
        }

        /* Three-option specific spacing */
        .options.three-options .btn {
            flex: 1;
            padding: 16px 12px;
            font-size: 15px;
        }

        .result-card {
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .result-icon {
            font-size: 100px;
            margin-bottom: 20px;
            animation: bounce 1s ease infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .result-title {
            font-size: 32px;
            color: #0c3483;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .result-description {
            font-size: 16px;
            color: #636e72;
            line-height: 1.6;
            margin-bottom: 25px;
            text-align: left;
            padding: 20px;
            background: white;
            border-radius: 12px;
        }

        .result-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .detail-box {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .detail-label {
            font-size: 12px;
            color: #636e72;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 18px;
            color: #2d3436;
            font-weight: 600;
        }

        .path-history {
            margin-top: 20px;
            text-align: left;
            background: white;
            padding: 20px;
            border-radius: 12px;
            max-height: 300px;
            overflow-y: auto;
        }

        .path-history h3 {
            margin-bottom: 15px;
            color: #0c3483;
        }

        .path-item {
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
            color: #636e72;
        }

        .path-item:last-child {
            border-bottom: none;
        }

        .path-answer {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 10px;
            font-weight: 600;
            margin-left: 5px;
        }

        .path-answer.option1 { background: #d4edda; color: #155724; }
        .path-answer.option2 { background: #f8d7da; color: #721c24; }
        .path-answer.option3 { background: #e8daef; color: #6c3483; }

        .btn-restart {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #0c3483, #1e5799);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-restart:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(12, 52, 131, 0.4);
        }

        .option-indicator {
            display: inline-block;
            background: #0c3483;
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            margin-left: 10px;
            vertical-align: middle;
        }

        .option-indicator.two { background: #00b894; }
        .option-indicator.three { background: #6c5ce7; }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .options {
                flex-direction: column;
            }
            .content {
                padding: 20px;
            }
            .question-text {
                font-size: 18px;
            }
            .btn {
                padding: 14px 20px;
                font-size: 16px;
            }
            .options.three-options .btn {
                font-size: 14px;
            }
        }
    </style>
</head>

            const node = decisionTree[nodeId];
            if (!node || node.result) return 1;
            
            let count = 1;
            const options = node.options || 2;
            
            if (node.option1 && typeof node.option1 === 'string') count += countQuestions(node.option1, visited);
            if (options === 3 && node.option3 && typeof node.option3 === 'string') count += countQuestions(node.option3, visited);
            if (node.option2 && typeof node.option2 === 'string') count += countQuestions(node.option2, visited);
            
            return count;
        }

        function startAssessment() {
            currentNode = 'start';
            questionCount = 0;
            path = [];
            
            document.getElementById('questionArea').classList.remove('hidden');
            document.getElementById('resultArea').classList.add('hidden');
            
            updateProgress();
            showQuestion(currentNode);
        }

        function updateProgress() {
            const totalQuestions = countQuestions('start');
            const progress = Math.min((questionCount / totalQuestions) * 100, 90);
            document.getElementById('progressBar').style.width = progress + '%';
            document.getElementById('progressText').textContent = 
                `Question ${questionCount} of approximately ${totalQuestions}`;
        }

        function showQuestion(nodeId) {
            const node = decisionTree[nodeId];
            questionCount++;
            
            document.getElementById('questionNumber').textContent = 
                `Question ${questionCount}`;
            document.getElementById('questionText').textContent = node.question;
            document.getElementById('questionContext').textContent = node.context || '';
            
            const numOptions = node.options || 2;
            const optionsContainer = document.getElementById('optionsContainer');
            
            if (numOptions === 3) {
                const label1 = node.label1 || "Yes";
                const label2 = node.label2 || "No";
                const label3 = node.label3 || "Somewhat";
                
                optionsContainer.className = 'options three-options';
                optionsContainer.innerHTML = `
                    <button class="btn btn-option1" onclick="handleAnswer('option1')">
                        ${label1}
                    </button>
                    <button class="btn btn-option3" onclick="handleAnswer('option3')">
                        ${label3}
                    </button>
                    <button class="btn btn-option2" onclick="handleAnswer('option2')">
                        ${label2}
                    </button>
                `;
            } else {
                const label1 = node.label1 || "Yes";
                const label2 = node.label2 || "No";
                
                optionsContainer.className = 'options two-options';
                optionsContainer.innerHTML = `
                    <button class="btn btn-option1" onclick="handleAnswer('option1')">
                        ${label1}
                    </button>
                    <button class="btn btn-option2" onclick="handleAnswer('option2')">
                        ${label2}
                    </button>
                `;
            }
            
            updateProgress();
        }

        function handleAnswer(answer) {
            const node = decisionTree[currentNode];
            
            // Determine the label based on which button was clicked
            let displayLabel;
            if (answer === 'option1') {
                displayLabel = node.label1 || "Yes";
            } else if (answer === 'option3') {
                displayLabel = node.label3 || "Somewhat";
            } else {
                displayLabel = node.label2 || "No";
            }
            
            path.push({
                question: node.question,
                answer: displayLabel,
                answerType: answer,
                context: node.context,
                options: node.options || 2
            });
            
            // Determine next node based on answer
            let nextNode = node[answer];
            
            if (typeof nextNode === 'object' && nextNode !== null) {
                // We've reached a result
                showResult(nextNode);
            } else if (typeof nextNode === 'string') {
                // Continue to next question
                currentNode = nextNode;
                showQuestion(currentNode);
            } else {
                console.error('Invalid node structure', node, answer);
            }
        }

        function showResult(result) {
            document.getElementById('questionArea').classList.add('hidden');
            document.getElementById('resultArea').classList.remove('hidden');
            
            document.getElementById('progressBar').style.width = '100%';
            document.getElementById('progressText').textContent = 'Assessment Complete!';
            
            document.getElementById('resultIcon').textContent = result.icon;
            document.getElementById('resultTitle').textContent = result.title;
            document.getElementById('resultDescription').textContent = result.description;
            
            // Populate details
            const detailsHtml = result.details.map(detail => `
                <div class="detail-box">
                    <div class="detail-label">${detail.label}</div>
                    <div class="detail-value">${detail.value}</div>
                </div>
            `).join('');
            document.getElementById('resultDetails').innerHTML = detailsHtml;
            
            // Populate reasoning path
            const pathHtml = path.map((step, index) => `
                <div class="path-item">
                    <strong>Q${index + 1}:</strong> ${step.question}
                    ${step.options === 3 ? '<span class="option-indicator three">3 options</span>' : '<span class="option-indicator two">2 options</span>'}
                    <br>
                    <span class="path-answer ${step.answerType}">→ ${step.answer}</span>
                </div>
            `).join('');
            document.getElementById('pathHistory').innerHTML = 
                `<h3>📋 Your Decision Path</h3>${pathHtml}`;
            
            document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth' });
        }

        function restartAssessment() {
            startAssessment();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Keyboard support
        document.addEventListener('keydown', function(event) {
            const node = decisionTree[currentNode];
            if (!node) return;
            
            const numOptions = node.options || 2;
            
            if (!document.getElementById('resultArea').classList.contains('hidden')) return;
            
            if (numOptions === 3) {
                if (event.key === 'ArrowLeft' || event.key === 'a') {
                    handleAnswer('option1');
                } else if (event.key === 'ArrowDown' || event.key === 's') {
                    handleAnswer('option3');
                } else if (event.key === 'ArrowRight' || event.key === 'd') {
                    handleAnswer('option2');
                }
            } else {
                if (event.key === 'ArrowLeft' || event.key === 'a') {
                    handleAnswer('option1');
                } else if (event.key === 'ArrowRight' || event.key === 'd') {
                    handleAnswer('option2');
                }
            }
        });

        // Initialize
        startAssessment();
    </script>
</body>
</html>
